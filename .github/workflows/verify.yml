name: Verificación (temporal)

# Corre al cambiar verify_trigger.txt. NO commitea datos — solo valida que los
# 3 scrapers funcionan en el entorno de GitHub. Se elimina tras verificar.
on:
  push:
    paths:
      - 'verify_trigger.txt'

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Instalar Playwright + Chromium
        run: python -m playwright install chromium --with-deps
      - name: Corrida de prueba (sin commit)
        run: python main.py
        env:
          PYTHONUNBUFFERED: "1"
